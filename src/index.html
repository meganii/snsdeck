<!DOCTYPE html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>snsDeck</title>
  </head>
  <body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="container" class="overflow-x-scroll whitespace-nowrap h-screen">
      <div id="controller" class="relative h-full"></div>
    </div>

    <div class="fixed top-4 left-4 flex flex-col gap-2">
      <button
        id="addColumn"
        onclick="snsdeck.openAddColumn()"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded shadow-md transition-colors"
      >
        Add Column
      </button>

      <button
        id="toggleTheme"
        class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 rounded shadow-md transition-colors"
      >
        Toggle Theme
      </button>
    </div>

    <script type="module" src="./renderer.ts"></script>
    <script>
      const toggleBtn = document.getElementById('toggleTheme');
      toggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });
    </script>
  </body>
</html>
